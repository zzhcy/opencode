# 文件路径：.github/workflows/build-windows-arm64.yml

name: Build Windows ARM64 (Fixed)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.10'

jobs:
  # ============================================================
  # 作业 1：构建 OpenCode CLI (Windows ARM64)
  # ============================================================
  build-cli-arm64:
    name: Build CLI (Windows ARM64)
    runs-on: windows-arm64
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      # 直接使用 bun build 构建 CLI（跳过 script/build.ts）
      - name: Build OpenCode CLI
        working-directory: packages/opencode
        run: |
          # 尝试直接构建 CLI
          bun build ./src/index.ts `
            --target=browser `
            --outdir=./bin `
            --outfile=opencode `
            --minify-identifiers `
            --minify `
            --treeshake `
            --sourcemap=external
        shell: bash

      # 准备 Sidecar
      - name: Prepare sidecar
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          
          # 复制 CLI 到 sidecars
          $cliPath = "packages/opencode/bin/opencode"
          if (Test-Path "$cliPath.exe") {
            $cliPath = "$cliPath.exe"
          }
          
          Write-Host "CLI path: $cliPath"
          Write-Host "Exists: $(Test-Path $cliPath)"
          
          Copy-Item $cliPath "packages/desktop/src-tauri/sidecars/opencode-cli-aarch64-pc-windows-msvc.exe" -Force
          
          Get-ChildItem packages/desktop/src-tauri/sidecars
        shell: powershell

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: cli-sidecar-arm64
          path: packages/desktop/src-tauri/sidecars/
          retention-days: 1

  # ============================================================
  # 作业 2：构建 Tauri 应用
  # ============================================================
  build-tauri-arm64:
    name: Build Tauri (Windows ARM64)
    runs-on: windows-arm64
    needs: build-cli-arm64
    timeout-minutes: 300
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: cli-sidecar-arm64
          path: packages/desktop/src-tauri/sidecars

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/desktop
          bun install
        shell: bash

      - name: Build frontend
        working-directory: packages/desktop
        run: bun run build
        shell: bash

      - name: Build Tauri application
        working-directory: packages/desktop
        run: bun run tauri build --target aarch64-pc-windows-msvc
        shell: bash
        env:
          CARGO_HOME: C:\Users\runneradmin\.cargo
          RUSTUP_HOME: C:\Users\runneradmin\.rustup

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-arm64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/opencode*.exe
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

  # ============================================================
  # 作业 3：构建 Windows x64 版本
  # ============================================================
  build-tauri-x64:
    name: Build Tauri (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/opencode
          bun install
          cd ../desktop
          bun install

      - name: Build CLI (x64)
        working-directory: packages/opencode
        run: |
          bun build ./src/index.ts `
            --target=browser `
            --outdir=./bin `
            --outfile=opencode `
            --minify-identifiers `
            --minify `
            --treeshake `
            --sourcemap=external
        shell: bash

      - name: Prepare sidecar
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          Copy-Item packages/opencode/bin/opencode packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe")) {
            Copy-Item packages/opencode/bin/opencode.exe packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe -Force
          }
        shell: powershell

      - name: Build Tauri application
        working-directory: packages/desktop
        run: |
          bun run build
          bun run tauri build
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/release/opencode*.exe
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
