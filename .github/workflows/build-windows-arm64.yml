# 文件路径：.github/workflows/build-windows-arm64.yml
# 文件内容：

name: Build Windows ARM64

on:
  # 在推送和拉取请求时触发
  push:
    branches:
      - main
      - 'feature/**'      # 所有功能分支
      - 'fix/**'          # 所有修复分支
    paths-ignore:
      - '**.md'            # 忽略文档变更
      - 'docs/**'          # 忽略文档目录
  pull_request:
    branches:
      - main
  # 手动触发（可在 GitHub 网页上点击按钮触发）
  workflow_dispatch:

# 设置环境变量
env:
  BUN_VERSION: 'latest'
  NODE_VERSION: '20'

# 定义作业
jobs:
  # 主要构建作业
  build-windows-arm64:
    name: Build Windows ARM64
    # 关键：使用 Windows ARM64 托管运行器
    runs-on: windows-arm64
    timeout-minutes: 120
    
    # 构建步骤
    steps:
      # 步骤 1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 完整获取历史（用于版本计算）
          fetch-depth: 0
          # 启用 Git LFS（大文件支持）
          lfs: true

      # 步骤 2：设置 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      # 步骤 3：安装项目依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      # 步骤 4：构建 TypeScript 源代码
      - name: Build TypeScript
        run: bun run build
        shell: bash

      # 步骤 5：构建桌面应用
      - name: Build desktop application
        run: bun run build:desktop
        shell: bash
        env:
          # 强制指定 ARM64 架构
          npm_config_arch: arm64
          ELECTRON_ARCH: arm64
          ELECTRON_PLATFORM: win32

      # 步骤 6：打包 Windows ARM64 版本
      - name: Package with electron-builder
        run: |
          bunx electron-builder --win arm64 --publish never
        shell: bash

      # 步骤 7：上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 产物名称（包含构建号便于区分）
          name: opencode-windows-arm64-${{ github.run_number }}
          # 上传的文件路径
          path: |
            release/**/*.exe
            release/**/*.zip
          # 保留天数
          retention-days: 30

      # 步骤 8：列出所有产物（调试用）
      - name: List build artifacts
        run: |
          Get-ChildItem -Path release -Recurse -File | Format-Table FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}}
        shell: powershell

  # 可选：同时构建 x64 版本进行对比测试
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run build
          bun run build:desktop

      - name: Package
        run: bunx electron-builder --win x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64-${{ github.run_number }}
          path: |
            release/**/*.exe
          retention-days: 30
