# ============================================================
# OpenCode Windows ARM64 完整构建工作流
# CLI: TypeScript/Bun | Desktop: Tauri 2.x
# ============================================================

name: Build Windows ARM64 (OpenCode)

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.10'

jobs:
  # ============================================================
  # 作业 1：构建 OpenCode CLI (Windows ARM64)
  # ============================================================
  build-cli-arm64:
    name: Build CLI (Windows ARM64)
    runs-on: windows-arm64
    timeout-minutes: 120
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      # 3. 安装根目录依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      # 4. 查看构建脚本
      - name: Check build script
        run: |
          Write-Host "=== Build Script ==="
          Get-Content script/build.ts -Head -20
        shell: powershell

      # 5. 构建 CLI
      - name: Build OpenCode CLI
        working-directory: packages/opencode
        run: bun run build
        shell: bash

      # 6. 验证 CLI 输出
      - name: Verify CLI output
        run: |
          Write-Host "=== Checking CLI output ==="
          
          # 检查标准输出位置
          $cliPaths = @(
            "packages/opencode/bin/opencode",
            "packages/opencode/dist/opencode",
            "packages/opencode/out/opencode",
            "script/bin/opencode"
          )
          
          foreach ($path in $cliPaths) {
            if (Test-Path $path) {
              Write-Host "Found CLI at: $path"
              Get-ChildItem $path | Format-Table Name, Length
            }
          }
          
          # 列出所有可能的输出
          Get-ChildItem -Path packages/opencode -Recurse -Directory -Depth 2 | Where-Object { $_.Name -in @('bin', 'dist', 'out', 'build') } | ForEach-Object {
            Write-Host "`n$($_.FullName):"
            Get-ChildItem $_.FullName | Format-Table Name, Length
          }
        shell: powershell

      # 7. 准备 Sidecar 文件
      - name: Prepare sidecar
        run: |
          Write-Host "=== Preparing sidecar for Tauri ==="
          
          # 创建 sidecars 目录
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          
          # 查找 CLI 二进制（尝试多个位置）
          $found = $false
          $possibleSources = @(
            @{Path="packages/opencode/bin/opencode"; Dest="opencode-cli-aarch64-pc-windows-msvc.exe"},
            @{Path="packages/opencode/dist/opencode"; Dest="opencode-cli-aarch64-pc-windows-msvc.exe"},
            @{Path="script/bin/opencode"; Dest="opencode-cli-aarch64-pc-windows-msvc.exe"}
          )
          
          foreach ($item in $possibleSources) {
            if (Test-Path $item.Path) {
              Write-Host "Copying from: $($item.Path)"
              Copy-Item $item.Path "packages/desktop/src-tauri/sidecars/$($item.Dest)" -Force
              $found = $true
              break
            }
          }
          
          if (-not $found) {
            # 如果没有找到，检查是否需要添加 .exe 后缀
            $exePath = "packages/opencode/bin/opencode.exe"
            if (Test-Path $exePath) {
              Copy-Item $exePath "packages/desktop/src-tauri/sidecars/opencode-cli-aarch64-pc-windows-msvc.exe" -Force
              $found = $true
            }
          }
          
          # 列出最终结果
          Write-Host "`n=== Sidecars directory ==="
          Get-ChildItem packages/desktop/src-tauri/sidecars | Format-Table Name, Length
          
          if (-not $found) {
            Write-Host "ERROR: CLI binary not found!"
            exit 1
          }
        shell: powershell

      # 8. 上传 sidecar
      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: cli-sidecar-arm64
          path: packages/desktop/src-tauri/sidecars/
          retention-days: 1

  # ============================================================
  # 作业 2：构建 Tauri 应用 (Windows ARM64)
  # ============================================================
  build-tauri-arm64:
    name: Build Tauri (Windows ARM64)
    runs-on: windows-arm64
    needs: build-cli-arm64
    timeout-minutes: 300
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 下载 sidecar
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: cli-sidecar-arm64
          path: packages/desktop/src-tauri/sidecars

      # 3. 验证 sidecar
      - name: Verify sidecar
        run: |
          Write-Host "=== Sidecars ==="
          Get-ChildItem packages/desktop/src-tauri/sidecars -Recurse | Format-Table FullName, Length
        shell: powershell

      # 4. 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      # 5. 安装依赖
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/desktop
          bun install
        shell: bash

      # 6. 构建前端
      - name: Build frontend
        working-directory: packages/desktop
        run: bun run build
        shell: bash

      # 7. 构建 Tauri 应用
      - name: Build Tauri application
        working-directory: packages/desktop
        run: bun run tauri build --target aarch64-pc-windows-msvc
        shell: bash
        env:
          CARGO_HOME: C:\Users\runneradmin\.cargo
          RUSTUP_HOME: C:\Users\runneradmin\.rustup

      # 8. 查找构建产物
      - name: Find artifacts
        run: |
          Write-Host "=== Finding artifacts ==="
          Get-ChildItem -Path . -Recurse -Filter "*.exe" -File -EA SilentlyContinue | 
            Where-Object { $_.FullName -like "*aarch64*" } |
            Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}}
        shell: powershell

      # 9. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-arm64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/opencode*.exe
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.msi
          retention-days: 30

  # ============================================================
  # 作业 3：构建 Windows x64 版本（对比）
  # ============================================================
  build-tauri-x64:
    name: Build Tauri (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/opencode
          bun install
          cd ../desktop
          bun install

      - name: Build CLI
        working-directory: packages/opencode
        run: bun run build
        shell: bash

      - name: Prepare sidecar
        run: |
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          # 复制 CLI 到 sidecars（x64 版本）
          Copy-Item packages/opencode/bin/opencode packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe")) {
            Copy-Item packages/opencode/bin/opencode.exe packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe -Force
          }
        shell: powershell

      - name: Build Tauri application
        working-directory: packages/desktop
        run: |
          bun run build
          bun run tauri build
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/release/opencode*.exe
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
          retention-days: 30

  # ============================================================
  # 作业 4：创建发布
  # ============================================================
  release:
    needs: [build-tauri-arm64, build-tauri-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List artifacts
        run: find release -type f -name "*.exe" -o -name "*.msi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/**/*.exe
            release/**/*.msi
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
