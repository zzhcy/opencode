# ============================================================
# OpenCode Windows ARM64 GitHub Actions 构建工作流
# 适用于 Tauri 2.x 项目
# ============================================================

name: Build Windows ARM64 (Tauri)

on:
  # 在推送代码时自动触发
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'packages/desktop/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/**'
  # 在创建拉取请求时触发
  pull_request:
    branches:
      - main
    paths:
      - 'packages/desktop/**'
  # 手动触发（可在 GitHub 网页上点击按钮）
  workflow_dispatch:

# 设置环境变量
env:
  BUN_VERSION: '1.3.10'

jobs:
  # ============================================================
  # 主要构建作业：Windows ARM64
  # ============================================================
  build-windows-arm64:
    name: Build Tauri Windows ARM64
    # 关键：使用 Windows ARM64 托管运行器
    runs-on: windows-arm64
    timeout-minutes: 300
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. 设置 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      # 3. 安装根目录依赖
      - name: Install root dependencies
        run: bun install --frozen-lockfile
        shell: bash

      # 4. 进入 desktop 目录并安装依赖
      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: bun install
        shell: bash

      # 5. 构建前端（Vite）
      - name: Build frontend
        working-directory: packages/desktop
        run: bun run build
        shell: bash

      # 6. 构建 Tauri 应用（ARM64）
      - name: Build Tauri application
        working-directory: packages/desktop
        run: bun run tauri build --target aarch64-pc-windows-msvc
        shell: bash
        env:
          # Rust 编译配置
          CARGO_HOME: C:\Users\runneradmin\.cargo
          RUSTUP_HOME: C:\Users\runneradmin\.rustup
          # 强制 ARM64 架构
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC: 1

      # 7. 查找构建产物
      - name: Find build artifacts
        run: |
          Write-Host "=== Searching for .exe files ==="
          Get-ChildItem -Path . -Recurse -Filter "*.exe" -File -EA SilentlyContinue | Select-Object FullName, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}}
        shell: powershell

      # 8. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-arm64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/opencode*.exe
          retention-days: 30
          compression-level: 9

  # ============================================================
  # 对比构建：Windows x64
  # ============================================================
  build-windows-x64:
    name: Build Tauri Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        working-directory: packages/desktop
        run: |
          bun install
          bun run build
          bun run tauri build
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64-v${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/release/opencode*.exe
          retention-days: 30

  # ============================================================
  # 发布作业（仅在 tag 时触发）
  # ============================================================
  release:
    needs: [build-windows-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List artifacts
        run: |
          echo "=== Release Artifacts ==="
          find release -type f -name "*.exe" -o -name "*.msi" | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/**/*.exe
            release/**/*.msi
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
