# 文件路径：.github/workflows/build-windows-arm64.yml

name: Build Windows ARM64 (Tauri)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  # 手动触发
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.10'
  # Tauri 版本（根据实际情况调整）
  TAURI_VERSION: '2.x'

jobs:
  build-windows-arm64:
    name: Build Tauri Windows ARM64
    runs-on: windows-arm64
    timeout-minutes: 300
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. 安装 Rust（tauri 需要）
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-pc-windows-msvc

      # 3. 安装前端工具链
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      # 4. 安装 Tauri CLI
      - name: Install Tauri CLI
        run: |
          bunx @tauri-apps/cli@${{ env.TAURI_VERSION }} tauri build --help
        shell: bash

      # 5. 安装依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      # 6. 构建前端（如果需要）
      - name: Build frontend
        run: |
          # Tauri 通常会自动构建前端，但有时需要手动
          cd packages/desktop
          bun install
          bun run build 2>/dev/null || true
        shell: bash

      # 7. 构建 Tauri 应用
      - name: Build Tauri application
        working-directory: packages/desktop
        run: |
          bunx @tauri-apps/cli build --target aarch64-pc-windows-msvc
        shell: bash
        env:
          # 强制 ARM64 编译
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: aarch64-pc-windows-msvc

      # 8. 查找构建产物
      - name: Find build artifacts
        run: |
          Write-Host "=== Searching for .exe files ==="
          Get-ChildItem -Path . -Recurse -Filter "*.exe" -File | Select-Object FullName, Length
        shell: powershell

      # 9. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-tauri-windows-arm64-${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/**/*.exe
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/**/*.msi
            packages/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/**/*.msix
          retention-days: 30

  # 同时构建 x64 版本
  build-windows-x64:
    name: Build Tauri Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri application
        working-directory: packages/desktop
        run: |
          bunx @tauri-apps/cli build
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-tauri-windows-x64-${{ github.run_number }}
          path: |
            packages/desktop/src-tauri/target/release/**/*.exe
          retention-days: 30
